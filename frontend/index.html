<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F3ECD8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15110E" media="(prefers-color-scheme: dark)" />
    <title>Tranche Protocol</title>
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:title" content="Tranche Protocol" />
    <meta property="og:description" content="Trustless invoice escrow and milestone-driven USDC payments. Built on Arc." />
    <meta property="og:image" content="https://trancheprotocol.xyz/og-image.png" />
    <meta property="og:url" content="https://trancheprotocol.xyz" />
    <meta property="og:type" content="website" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tranche Protocol" />
    <meta name="twitter:description" content="Trustless invoice escrow and milestone-driven USDC payments. Built on Arc." />
    <meta name="twitter:image" content="https://trancheprotocol.xyz/og-image.png" />

    <!-- Self-hosted typefaces. Same origin as the app, so no preconnect and
         no third-party request on first paint. The same file is handed to
         Circle's wallet widget by absolute URL (src/utils/circleTheme.js), so
         edit public/fonts/tranche-fonts.css rather than adding faces here. -->
    <link rel="preload" href="/fonts/Switzer-Variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/fonts/tranche-fonts.css">
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'light';
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
